<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Notas - Matemáticas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-in { animation: fadeIn 0.5s ease; }
        .slide-in { animation: slideIn 0.4s ease; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }
        .dark .spinner {
            border-color: #374151;
            border-top-color: #3b82f6;
        }
        .radio-card { transition: all 0.2s; }
        .radio-card:hover { transform: translateY(-2px); }
        input[type="radio"]:checked + label {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 dark:bg-gray-900 flex items-center justify-center p-4 sm:p-6 transition-colors">
    <div class="w-full max-w-2xl">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden fade-in transition-colors">

            <div class="bg-blue-600 px-6 py-6 sm:px-8 print:hidden">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div class="flex-shrink-0 w-12 h-12 bg-white/10 rounded-lg flex items-center justify-center">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-white">
                                Portal de calificaciones
                            </h1>
                            <p class="text-blue-100 text-sm mt-1">
                                Profesor: Raimundo Alba García
                            </p>
                            <p class="text-blue-100 text-sm mt-0.5">
                                Matemáticas • Curso 2026-2027
                            </p>
                        </div>
                    </div>
                    <button id="btnModo" onclick="alternarModo()" class="flex-shrink-0 w-10 h-10 bg-white/10 hover:bg-white/20 rounded-lg flex items-center justify-center transition-colors" title="Cambiar tema claro/oscuro">
                        <span id="iconoModo"></span>
                    </button>
                </div>
            </div>
            <div class="px-6 py-8 sm:px-8 bg-white dark:bg-gray-800 transition-colors">
                <div class="space-y-6 print:hidden">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3 uppercase tracking-wide">
                            Selecciona tu curso
                        </label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div class="radio-card">
                                <input type="radio" id="file1" name="archivo" value="file1" class="hidden">
                                <label for="file1" class="block cursor-pointer border-2 border-gray-200 dark:border-gray-600 rounded-lg p-4 text-center font-medium text-gray-700 dark:text-gray-200 hover:border-blue-400">
                                    2º BTO A-C
                                </label>
                            </div>
                            <div class="radio-card">
                                <input type="radio" id="file2" name="archivo" value="file2" class="hidden">
                                <label for="file2" class="block cursor-pointer border-2 border-gray-200 dark:border-gray-600 rounded-lg p-4 text-center font-medium text-gray-700 dark:text-gray-200 hover:border-blue-400">
                                    2º ESO A
                                </label>
                            </div>
                            <div class="radio-card">
                                <input type="radio" id="file3" name="archivo" value="file3" class="hidden">
                                <label for="file3" class="block cursor-pointer border-2 border-gray-200 dark:border-gray-600 rounded-lg p-4 text-center font-medium text-gray-700 dark:text-gray-200 hover:border-blue-400">
                                    4º ESO C
                                </label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="dni" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">
                            Documento de Identidad
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                                </svg>
                            </div>
                            <input
                                type="text"
                                id="dni"
                                maxlength="9"
                                placeholder="Ejemplo: 12345678A"
                                autocomplete="off"
                                class="w-full pl-12 pr-4 py-3.5 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-800 focus:border-blue-500 outline-none transition-all text-base"
                            >
                        </div>
                        <p id="dniAyuda" class="text-xs mt-1.5 min-h-[1rem]"></p>
                    </div>

                    <button
                        onclick="buscarNotas()"
                        id="btnBuscar"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <span>Consultar Calificaciones</span>
                    </button>
                </div>

                <div id="resultado" class="mt-6"></div>
            </div>
        </div>

        <div class="text-center mt-6 text-gray-500 dark:text-gray-400 text-sm print:hidden">
            <p>Sistema de consulta de calificaciones</p>
        </div>
    </div>

    <script>
        // IMPORTANTE: Reemplaza esta URL con la URL de tu Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1hxGFscLd7ZXeznsgcd3-k3i48f5Qj1FlkKZ2MEjTD2QY4W8CvGiMq3VaQ7a3h0ZfJw/exec';

        let graficoActual = null;

        // --- Almacenamiento (con protección por si localStorage no está disponible, p.ej. en vistas previas aisladas) ---

        function storageDisponible() {
            try {
                const test = '__test__';
                localStorage.setItem(test, test);
                localStorage.removeItem(test);
                return true;
            } catch (e) {
                return false;
            }
        }
        const hayStorage = storageDisponible();

        function guardar(clave, valor) {
            if (!hayStorage) return;
            try { localStorage.setItem(clave, valor); } catch (e) {}
        }

        function leer(clave) {
            if (!hayStorage) return null;
            try { return localStorage.getItem(clave); } catch (e) { return null; }
        }

        // --- Modo oscuro ---

        const SVG_SOL = '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>';
        const SVG_LUNA = '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>';

        let modoOscuro = false;

        function aplicarModo(activo) {
            modoOscuro = activo;
            document.documentElement.classList.toggle('dark', activo);
            const icono = document.getElementById('iconoModo');
            if (icono) icono.innerHTML = activo ? SVG_SOL : SVG_LUNA;
        }

        function alternarModo() {
            aplicarModo(!modoOscuro);
            guardar('modo_oscuro', modoOscuro ? '1' : '0');
        }

        (function inicializarModo() {
            const guardado = leer('modo_oscuro');
            const prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            aplicarModo(guardado !== null ? guardado === '1' : prefiereOscuro);
        })();

        // --- Recordar el curso seleccionado ---

        (function inicializarCurso() {
            const cursoGuardado = leer('curso_seleccionado');
            if (cursoGuardado) {
                const radio = document.getElementById(cursoGuardado);
                if (radio) radio.checked = true;
            }
        })();

        document.querySelectorAll('input[name="archivo"]').forEach(function(radio) {
            radio.addEventListener('change', function() {
                guardar('curso_seleccionado', radio.id);
            });
        });

        // --- Validación del DNI / NIE ---

        function analizarDNI(valor) {
            const dniMatch = valor.match(/^(\d{8})([A-Z])$/);
            const nieMatch = valor.match(/^([XYZ])(\d{7})([A-Z])$/);
            let numero, letra;

            if (dniMatch) {
                numero = parseInt(dniMatch[1], 10);
                letra = dniMatch[2];
            } else if (nieMatch) {
                const prefijo = { X: '0', Y: '1', Z: '2' }[nieMatch[1]];
                numero = parseInt(prefijo + nieMatch[2], 10);
                letra = nieMatch[3];
            } else {
                return { formatoOk: false, letraOk: false };
            }

            const letras = 'TRWAGMYFPDXBNJZSQVHLCKE';
            const letraEsperada = letras.charAt(numero % 23);
            return { formatoOk: true, letraOk: letra === letraEsperada, letraEsperada };
        }

        function formatoValido(valor) {
            const analisis = analizarDNI(valor);
            return analisis.formatoOk && analisis.letraOk;
        }

        const dniInput = document.getElementById('dni');
        const dniAyuda = document.getElementById('dniAyuda');

        dniInput.addEventListener('input', function() {
            const cursor = dniInput.selectionStart;
            dniInput.value = dniInput.value.toUpperCase().replace(/\s/g, '');
            dniInput.setSelectionRange(cursor, cursor);
            validarCampoDNI();
        });

        function validarCampoDNI() {
            const valor = dniInput.value.trim();

            if (valor === '') {
                dniAyuda.textContent = '';
                return null;
            }

            const analisis = analizarDNI(valor);

            if (!analisis.formatoOk) {
                dniAyuda.textContent = 'Formato esperado: 8 números y una letra (o X/Y/Z + 7 números + letra)';
                dniAyuda.className = 'text-xs mt-1.5 min-h-[1rem] text-red-500 dark:text-red-400';
                return false;
            }

            if (!analisis.letraOk) {
                dniAyuda.textContent = 'La letra no coincide con el número. Revisa que el DNI esté bien escrito.';
                dniAyuda.className = 'text-xs mt-1.5 min-h-[1rem] text-red-500 dark:text-red-400';
                return false;
            }

            dniAyuda.textContent = '';
            return true;
        }

        document.getElementById('dni').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarNotas();
            }
        });

        // --- Utilidades para la comparación visual con la media ---

        function parseNumero(valor) {
            if (valor === null || valor === undefined || valor === '') return null;
            const num = parseFloat(valor.toString().replace(',', '.'));
            return isNaN(num) ? null : num;
        }

        function compararConMedia(valor, media) {
            const num = parseNumero(valor);
            const numMedia = parseNumero(media);
            if (num === null || numMedia === null) return null;

            const diff = num - numMedia;
            const escala = Math.max(num, numMedia, 10);
            const pctAlumno = Math.min(100, (num / escala) * 100);
            const pctMedia = Math.min(100, (numMedia / escala) * 100);
            const igual = Math.abs(diff) < 0.01;

            return { num, numMedia, diff, pctAlumno, pctMedia, arriba: diff > 0, igual };
        }

        function barraClara(comp) {
            if (!comp) return '';
            const { pctAlumno, pctMedia, diff, arriba, igual } = comp;
            const colorBarra = igual ? 'bg-gray-400' : (arriba ? 'bg-green-500' : 'bg-red-500');
            const indicador = igual
                ? `<span class="text-gray-500 dark:text-gray-400">Igual que la media</span>`
                : arriba
                    ? `<span class="text-green-600 dark:text-green-400 font-semibold">↑ ${Math.abs(diff).toFixed(2)} sobre la media</span>`
                    : `<span class="text-red-500 dark:text-red-400 font-semibold">↓ ${Math.abs(diff).toFixed(2)} bajo la media</span>`;

            return `
                <div class="mt-2">
                    <div class="relative h-2.5 bg-gray-200 dark:bg-gray-600 rounded-full overflow-hidden">
                        <div class="h-full ${colorBarra} rounded-full" style="width:${pctAlumno}%"></div>
                        <div class="absolute top-0 h-full w-0.5 bg-gray-700 dark:bg-gray-200" style="left:${pctMedia}%"></div>
                    </div>
                    <div class="text-xs mt-1">${indicador}</div>
                </div>
            `;
        }

        function barraOscura(comp) {
            if (!comp) return '';
            const { pctAlumno, pctMedia, diff, arriba, igual } = comp;
            const colorBarra = igual ? 'bg-gray-200' : (arriba ? 'bg-green-400' : 'bg-red-400');
            const indicador = igual
                ? `<span class="text-blue-100">Igual que la media</span>`
                : arriba
                    ? `<span class="text-green-300 font-semibold">↑ ${Math.abs(diff).toFixed(2)} sobre la media</span>`
                    : `<span class="text-red-300 font-semibold">↓ ${Math.abs(diff).toFixed(2)} bajo la media</span>`;

            return `
                <div class="mt-2">
                    <div class="relative h-2.5 bg-white/20 rounded-full overflow-hidden">
                        <div class="h-full ${colorBarra} rounded-full" style="width:${pctAlumno}%"></div>
                        <div class="absolute top-0 h-full w-0.5 bg-white" style="left:${pctMedia}%"></div>
                    </div>
                    <div class="text-xs mt-1">${indicador}</div>
                </div>
            `;
        }

        // --- Gráfico de evolución ---

        function dibujarEvolucion(evolucion) {
            const canvas = document.getElementById('graficoEvolucion');
            if (!canvas) return;

            if (graficoActual) {
                graficoActual.destroy();
                graficoActual = null;
            }

            const colorTexto = modoOscuro ? '#d1d5db' : '#374151';
            const colorRejilla = modoOscuro ? '#374151' : '#e5e7eb';

            const datasets = [
                {
                    label: 'Tu nota',
                    data: evolucion.map(e => e.valor),
                    borderColor: '#2563eb',
                    backgroundColor: '#2563eb',
                    tension: 0.3,
                    pointRadius: 4,
                    pointHoverRadius: 6
                }
            ];

            const hayMedia = evolucion.some(e => e.media !== null);
            if (hayMedia) {
                datasets.push({
                    label: 'Media del grupo',
                    data: evolucion.map(e => e.media),
                    borderColor: '#9ca3af',
                    backgroundColor: '#9ca3af',
                    borderDash: [5, 5],
                    tension: 0.3,
                    pointRadius: 3,
                    pointHoverRadius: 5
                });
            }

            graficoActual = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: evolucion.map(e => e.nombre),
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            suggestedMax: 10,
                            ticks: { color: colorTexto },
                            grid: { color: colorRejilla }
                        },
                        x: {
                            ticks: { color: colorTexto },
                            grid: { color: colorRejilla }
                        }
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { color: colorTexto } }
                    }
                }
            });
        }

        function mostrarAviso(mensaje) {
            return `
                <div class="bg-amber-50 dark:bg-amber-900/30 border-l-4 border-amber-500 p-4 rounded-lg slide-in">
                    <div class="flex items-center">
                        <svg class="w-6 h-6 text-amber-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <p class="text-amber-800 dark:text-amber-200 font-medium">${mensaje}</p>
                    </div>
                </div>
            `;
        }

        async function buscarNotas() {
            const dni = document.getElementById('dni').value.trim();
            const archivoSeleccionado = document.querySelector('input[name="archivo"]:checked');
            const resultado = document.getElementById('resultado');
            const btnBuscar = document.getElementById('btnBuscar');

            if (graficoActual) {
                graficoActual.destroy();
                graficoActual = null;
            }

            if (!archivoSeleccionado) {
                resultado.innerHTML = mostrarAviso('Por favor, selecciona tu curso');
                return;
            }

            if (!dni) {
                resultado.innerHTML = mostrarAviso('Por favor, introduce tu DNI');
                return;
            }

            if (!formatoValido(dni)) {
                validarCampoDNI();
                resultado.innerHTML = mostrarAviso('El DNI no tiene un formato válido. Revísalo antes de continuar.');
                return;
            }

            btnBuscar.disabled = true;
            btnBuscar.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Consultando...</span>
            `;

            resultado.innerHTML = `
                <div class="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-8 text-center slide-in">
                    <div class="spinner mx-auto mb-4"></div>
                    <p class="text-blue-700 dark:text-blue-300 font-medium">Buscando tus notas...</p>
                </div>
            `;

            try {
                const url = `${SCRIPT_URL}?archivo=${archivoSeleccionado.value}&dni=${encodeURIComponent(dni)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    resultado.innerHTML = `
                        <div class="bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 p-4 rounded-lg slide-in">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 text-red-500 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <p class="text-red-800 dark:text-red-300 font-medium">${data.error}</p>
                            </div>
                        </div>
                    `;
                } else {

                    let html = `
                        <div class="bg-green-50 dark:bg-green-900/20 border border-green-300 dark:border-green-700 rounded-lg slide-in">
                            <div class="p-4 sm:p-5 print:hidden">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center">
                                        <div class="flex-shrink-0 bg-green-500 rounded-full p-1.5 mr-3">
                                            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                            </svg>
                                        </div>
                                        <h3 class="text-lg font-semibold text-green-800 dark:text-green-300">Calificaciones Encontradas</h3>
                                    </div>
                                    <button onclick="window.print()" class="flex items-center space-x-1.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium px-3 py-1.5 rounded-lg shadow-sm transition-colors">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                                        </svg>
                                        <span>Imprimir / PDF</span>
                                    </button>
                                </div>
                            </div>

                            <div class="p-4 sm:p-5 border-t border-green-200 dark:border-green-800 print:border-t-0 print:p-0">
                    `;

                    if (data.columnas && data.columnas.length > 0) {

                        const infoAlumno = [];
                        const resto = [];

                        const columnasVisibles = data.columnas.filter(col => col.valor !== '' && col.valor !== null && col.valor !== undefined);

                        columnasVisibles.forEach(col => {
                            const nombreCol = (col.nombre || '').toUpperCase();
                            if (nombreCol === 'NOMBRE' || nombreCol === 'DNI' || nombreCol === 'DNIC') {
                                infoAlumno.push(col);
                            } else {
                                resto.push(col);
                            }
                        });

                        if (infoAlumno.length > 0) {
                            html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">`;
                            infoAlumno.forEach(col => {
                                html += `
                                    <div class="bg-white dark:bg-gray-700 rounded-lg p-3 border border-gray-200 dark:border-gray-600">
                                        <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">${col.nombre}</label>
                                        <div class="text-base font-bold text-gray-800 dark:text-gray-100 mt-1 truncate">${col.valor}</div>
                                    </div>
                                `;
                            });
                            html += `</div>`;
                        }

                        if (resto.length > 0) {
                            html += `<div class="space-y-3">`;

                            resto.forEach(col => {
                                if (col.tipo === 'comentario') {
                                    html += `
                                        <div class="bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg p-4 flex items-start space-x-3">
                                            <svg class="w-5 h-5 text-gray-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 4v-4z"></path>
                                            </svg>
                                            <div>
                                                <div class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase mb-1">${col.nombre}</div>
                                                <div class="text-sm text-gray-700 dark:text-gray-200 italic">${col.valor}</div>
                                            </div>
                                        </div>
                                    `;
                                } else if (col.tipo === 'destacada') {
                                    const comp = compararConMedia(col.valor, col.media);
                                    html += `
                                        <div class="bg-blue-600 rounded-lg p-4 shadow-md text-white">
                                            <div class="flex justify-between items-center">
                                                <span class="font-bold text-lg">${col.nombre}</span>
                                                <span class="text-3xl font-extrabold bg-white/20 px-4 py-1 rounded-md">${col.valor}</span>
                                            </div>
                                            ${col.media !== null ? `<div class="text-sm text-blue-100 mt-1.5">Media del grupo: ${col.media}</div>` : ''}
                                            ${barraOscura(comp)}
                                        </div>
                                    `;
                                } else {
                                    const comp = compararConMedia(col.valor, col.media);
                                    html += `
                                        <div class="bg-white dark:bg-gray-700 rounded-lg p-3 border border-gray-200 dark:border-gray-600">
                                            <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">${col.nombre}</label>
                                            <div class="text-base font-bold text-gray-800 dark:text-gray-100 mt-1 truncate">${col.valor}</div>
                                            ${col.media !== null ? `<div class="text-xs text-gray-500 dark:text-gray-400 mt-1">Media del grupo: ${col.media}</div>` : ''}
                                            ${barraClara(comp)}
                                        </div>
                                    `;
                                }
                            });

                            html += `</div>`;
                        }

                        if (infoAlumno.length === 0 && resto.length === 0) {
                             html += `
                                <div class="text-center py-4">
                                    <p class="text-gray-500 dark:text-gray-400 font-medium">No hay calificaciones configuradas para mostrar</p>
                                </div>
                            `;
                        }

                    } else {
                        html += `
                            <div class="text-center py-8">
                                <svg class="w-16 h-16 text-gray-300 dark:text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                                </svg>
                                <p class="text-gray-500 dark:text-gray-400 font-medium">No hay columnas configuradas para mostrar</p>
                            </div>
                        `;
                    }

                    html += `
                            </div>
                        </div>
                    `;

                    if (data.evolucion && data.evolucion.length >= 2) {
                        html += `
                            <div class="bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg p-4 sm:p-5 mt-4 slide-in">
                                <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wide mb-3">Evolución de notas</h3>
                                <div style="position: relative; height: 220px;">
                                    <canvas id="graficoEvolucion"></canvas>
                                </div>
                            </div>
                        `;
                    }

                    resultado.innerHTML = html;

                    if (data.evolucion && data.evolucion.length >= 2) {
                        dibujarEvolucion(data.evolucion);
                    }
                }
            } catch (error) {
                resultado.innerHTML = `
                    <div class="bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 p-4 rounded-lg slide-in">
                        <div class="flex items-center">
                            <svg class="w-6 h-6 text-red-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="text-red-800 dark:text-red-300 font-medium">Error de conexión. Por favor, inténtalo de nuevo.</p>
                        </div>
                    </div>
                `;
                console.error('Error:', error);
            } finally {
                btnBuscar.disabled = false;
                btnBuscar.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <span>Consultar Calificaciones</span>
                `;
            }
        }
    </script>
</body>
</html>
