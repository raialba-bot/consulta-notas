<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Notas - Matemáticas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-in { animation: fadeIn 0.5s ease; }
        .slide-in { animation: slideIn 0.4s ease; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }
        .radio-card { transition: all 0.2s; }
        .radio-card:hover { transform: translateY(-2px); }
        input[type="radio"]:checked + label {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-2xl">
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden fade-in">

            <div class="bg-blue-600 px-6 py-6 sm:px-8">
                <div class="flex items-center space-x-4">
                    <div class="flex-shrink-0 w-12 h-12 bg-white/10 rounded-lg flex items-center justify-center">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-white">
                            Portal de calificaciones
                        </h1>
                        <p class="text-blue-100 text-sm mt-1">
                            Profesor: Raimundo Alba García
                        </p>
                        <p class="text-blue-100 text-sm mt-0.5">
                            Matemáticas • Curso 2026-2027
                        </p>
                    </div>
                </div>
            </div>
            <div class="px-6 py-8 sm:px-8 bg-white">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-3 uppercase tracking-wide">
                            Selecciona tu curso
                        </label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div class="radio-card">
                                <input type="radio" id="file1" name="archivo" value="file1" class="hidden">
                                <label for="file1" class="block cursor-pointer border-2 border-gray-200 rounded-lg p-4 text-center font-medium text-gray-700 hover:border-blue-400">
                                    2º BTO A-C
                                </label>
                            </div>
                            <div class="radio-card">
                                <input type="radio" id="file2" name="archivo" value="file2" class="hidden">
                                <label for="file2" class="block cursor-pointer border-2 border-gray-200 rounded-lg p-4 text-center font-medium text-gray-700 hover:border-blue-400">
                                    2º ESO A
                                </label>
                            </div>
                            <div class="radio-card">
                                <input type="radio" id="file3" name="archivo" value="file3" class="hidden">
                                <label for="file3" class="block cursor-pointer border-2 border-gray-200 rounded-lg p-4 text-center font-medium text-gray-700 hover:border-blue-400">
                                    4º ESO C
                                </label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="dni" class="block text-sm font-semibold text-gray-700 mb-2 uppercase tracking-wide">
                            Documento de Identidad
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                                </svg>
                            </div>
                            <input
                                type="text"
                                id="dni"
                                maxlength="15"
                                placeholder="Ejemplo: 12345678A"
                                class="w-full pl-12 pr-4 py-3.5 border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-200 focus:border-blue-500 outline-none transition-all text-base"
                            >
                        </div>
                    </div>

                    <button
                        onclick="buscarNotas()"
                        id="btnBuscar"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <span>Consultar Calificaciones</span>
                    </button>
                </div>

                <div id="resultado" class="mt-6"></div>
            </div>
        </div>

        <div class="text-center mt-6 text-gray-500 text-sm">
            <p>Sistema de consulta de calificaciones</p>
        </div>
    </div>

    <script>
        // IMPORTANTE: Reemplaza esta URL con la URL de tu Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1hxGFscLd7ZXeznsgcd3-k3i48f5Qj1FlkKZ2MEjTD2QY4W8CvGiMq3VaQ7a3h0ZfJw/exec';

        document.getElementById('dni').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarNotas();
            }
        });

        async function buscarNotas() {
            const dni = document.getElementById('dni').value.trim();
            const archivoSeleccionado = document.querySelector('input[name="archivo"]:checked');
            const resultado = document.getElementById('resultado');
            const btnBuscar = document.getElementById('btnBuscar');

            if (!archivoSeleccionado) {
                resultado.innerHTML = `
                    <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-lg slide-in">
                        <div class="flex items-center">
                            <svg class="w-6 h-6 text-amber-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                            <p class="text-amber-800 font-medium">Por favor, selecciona tu curso</p>
                        </div>
                    </div>
                `;
                return;
            }

            if (!dni) {
                resultado.innerHTML = `
                    <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-lg slide-in">
                        <div class="flex items-center">
                            <svg class="w-6 h-6 text-amber-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                            <p class="text-amber-800 font-medium">Por favor, introduce tu DNI</p>
                        </div>
                    </div>
                `;
                return;
            }

            btnBuscar.disabled = true;
            btnBuscar.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Consultando...</span>
            `;

            resultado.innerHTML = `
                <div class="bg-blue-50 rounded-xl p-8 text-center slide-in">
                    <div class="spinner mx-auto mb-4"></div>
                    <p class="text-blue-700 font-medium">Buscando tus notas...</p>
                </div>
            `;

            try {
                const url = `${SCRIPT_URL}?archivo=${archivoSeleccionado.value}&dni=${encodeURIComponent(dni)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    resultado.innerHTML = `
                        <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-lg slide-in">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 text-red-500 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <p class="text-red-800 font-medium">${data.error}</p>
                            </div>
                        </div>
                    `;
                } else {

                    let html = `
                        <div class="bg-green-50 border border-green-300 rounded-lg slide-in">
                            <div class="p-4 sm:p-5">
                                <div class="flex items-center">
                                    <div class="flex-shrink-0 bg-green-500 rounded-full p-1.5 mr-3">
                                        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                        </svg>
                                    </div>
                                    <h3 class="text-lg font-semibold text-green-800">Calificaciones Encontradas</h3>
                                </div>
                            </div>

                            <div class="p-4 sm:p-5 border-t border-green-200">
                    `;

                    if (data.columnas && data.columnas.length > 0) {

                        const infoAlumno = [];
                        const resto = []; // se mantiene el orden original de la hoja

                        const columnasVisibles = data.columnas.filter(col => col.valor !== '' && col.valor !== null && col.valor !== undefined);

                        columnasVisibles.forEach(col => {
                            const nombreCol = (col.nombre || '').toUpperCase();
                            if (nombreCol === 'NOMBRE' || nombreCol === 'DNI' || nombreCol === 'DNIC') {
                                infoAlumno.push(col);
                            } else {
                                resto.push(col);
                            }
                        });

                        if (infoAlumno.length > 0) {
                            html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">`;
                            infoAlumno.forEach(col => {
                                html += `
                                    <div class="bg-white rounded-lg p-3 border border-gray-200">
                                        <label class="text-xs font-semibold text-gray-500 uppercase">${col.nombre}</label>
                                        <div class="text-base font-bold text-gray-800 mt-1 truncate">${col.valor}</div>
                                    </div>
                                `;
                            });
                            html += `</div>`;
                        }

                        if (resto.length > 0) {
                            html += `<div class="space-y-3">`;

                            resto.forEach(col => {
                                if (col.tipo === 'comentario') {
                                    html += `
                                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 flex items-start space-x-3">
                                            <svg class="w-5 h-5 text-gray-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 4v-4z"></path>
                                            </svg>
                                            <div>
                                                <div class="text-xs font-semibold text-gray-500 uppercase mb-1">${col.nombre}</div>
                                                <div class="text-sm text-gray-700 italic">${col.valor}</div>
                                            </div>
                                        </div>
                                    `;
                                } else if (col.tipo === 'destacada') {
                                    html += `
                                        <div class="bg-blue-600 rounded-lg p-4 shadow-md text-white">
                                            <div class="flex justify-between items-center">
                                                <span class="font-bold text-lg">${col.nombre}</span>
                                                <span class="text-3xl font-extrabold bg-white/20 px-4 py-1 rounded-md">${col.valor}</span>
                                            </div>
                                            ${col.media !== null ? `<div class="text-sm text-blue-100 mt-1.5">Media del grupo: ${col.media}</div>` : ''}
                                        </div>
                                    `;
                                } else {
                                    html += `
                                        <div class="bg-white rounded-lg p-3 border border-gray-200">
                                            <label class="text-xs font-semibold text-gray-500 uppercase">${col.nombre}</label>
                                            <div class="text-base font-bold text-gray-800 mt-1 truncate">${col.valor}</div>
                                            ${col.media !== null ? `<div class="text-xs text-gray-500 mt-1">Media del grupo: ${col.media}</div>` : ''}
                                        </div>
                                    `;
                                }
                            });

                            html += `</div>`;
                        }

                        if (infoAlumno.length === 0 && resto.length === 0) {
                             html += `
                                <div class="text-center py-4">
                                    <p class="text-gray-500 font-medium">No hay calificaciones configuradas para mostrar</p>
                                </div>
                            `;
                        }

                    } else {
                        html += `
                            <div class="text-center py-8">
                                <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                                </svg>
                                <p class="text-gray-500 font-medium">No hay columnas configuradas para mostrar</p>
                            </div>
                        `;
                    }

                    html += `
                            </div>
                        </div>
                    `;

                    resultado.innerHTML = html;
                }
            } catch (error) {
                resultado.innerHTML = `
                    <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-lg slide-in">
                        <div class="flex items-center">
                            <svg class="w-6 h-6 text-red-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="text-red-800 font-medium">Error de conexión. Por favor, inténtalo de nuevo.</p>
                        </div>
                    </div>
                `;
                console.error('Error:', error);
            } finally {
                btnBuscar.disabled = false;
                btnBuscar.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <span>Consultar Calificaciones</span>
                `;
            }
        }
    </script>
</body>
</html>
